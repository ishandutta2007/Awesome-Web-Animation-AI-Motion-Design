<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="40%" stop-color="#110d2e" />
      <stop offset="80%" stop-color="#180e38" />
      <stop offset="100%" stop-color="#070214" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.04; stroke-width: 1; }
    
    /* Dynamic background orbs and pulses */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.65; transform: scale(1.15) translate(20px, -15px); }
    }
    @keyframes floatWave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(38px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
    }
    @keyframes particleDrift {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.4; }
      50% { transform: translateY(-16px) scale(1.2); opacity: 0.9; }
    }
    @keyframes pillFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .orb-1 {
      transform-origin: 250px 120px;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .orb-2 {
      transform-origin: 950px 220px;
      animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
    }
    .wave-line {
      stroke: url(#primaryGlow);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 12 12;
      animation: floatWave 18s linear infinite;
      opacity: 0.45;
    }
    .wave-line-2 {
      stroke: #06b6d4;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 8 8;
      animation: floatWave 24s linear infinite reverse;
      opacity: 0.3;
    }
    .floating-pill {
      animation: pillFloat 4s ease-in-out infinite alternate;
    }
    .floating-pill-2 {
      animation: pillFloat 5s ease-in-out 1s infinite alternate;
    }
    .p1 { animation: particleDrift 4s ease-in-out infinite; }
    .p2 { animation: particleDrift 6s ease-in-out 1.5s infinite; }
    .p3 { animation: particleDrift 5s ease-in-out 0.8s infinite; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Perspective Motion Grid Lines (Background) -->
  <g class="grid-lines">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Glowing Mesh Orbs (strictly background) -->
  <circle cx="220" cy="110" r="140" fill="#6366f1" filter="url(#blurFilter)" class="orb-1" />
  <circle cx="980" cy="230" r="150" fill="#ec4899" filter="url(#blurFilter)" class="orb-2" />
  <circle cx="600" cy="310" r="120" fill="#06b6d4" opacity="0.25" filter="url(#blurFilter)" />

  <!-- Animated Spline Waves (under title) -->
  <path d="M-50,290 C200,240 350,330 600,280 C850,230 1000,320 1250,270" class="wave-line" />
  <path d="M-50,310 C250,350 450,260 700,310 C950,360 1100,290 1250,320" class="wave-line-2" />

  <!-- Interactive Dynamic Background Graphic Accents (Side wings, safe from central text) -->
  <g transform="translate(60, 45)" class="floating-pill">
    <rect width="135" height="34" rx="17" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" filter="url(#glowFilter)" />
    <text x="32" y="22" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">✦ 120 FPS WAAPI</text>
  </g>

  <g transform="translate(1005, 45)" class="floating-pill-2">
    <rect width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#ec4899" filter="url(#glowFilter)" />
    <text x="32" y="22" fill="#fdf4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⚡ AI MOTION AGENTS</text>
  </g>

  <!-- Ambient Dynamic Floating Particles (strictly periphery) -->
  <circle cx="110" cy="270" r="3" fill="#a855f7" class="p1" />
  <circle cx="190" cy="320" r="2.5" fill="#38bdf8" class="p2" />
  <circle cx="1060" cy="280" r="3.5" fill="#f43f5e" class="p3" />
  <circle cx="1140" cy="210" r="2" fill="#06b6d4" class="p1" />

  <!-- FOREGROUND HERO CONTENT (Guaranteed high visibility and foreground contrast) -->
  <g id="foreground-hero" transform="translate(600, 0)">
    <!-- Central Curated Pill Badge -->
    <g transform="translate(-160, 48)">
      <rect width="320" height="30" rx="15" fill="#1e1548" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="160" y="20" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title with high contrast gradient & drop-shadow glow -->
    <text x="0" y="145" text-anchor="middle" fill="url(#primaryGlow)" filter="url(#glowFilter)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Web Animation
    </text>
    <text x="0" y="196" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.2">
      &amp; AI Motion Design
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.3">
      Interactive Web Animations • Programmatic Video • Vector Runtimes • Autonomous Motion Skills
    </text>

    <!-- Tech Stack Feature Pills Row -->
    <g transform="translate(-300, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="105" height="26" rx="13" fill="#151336" stroke="#475569" stroke-width="1" />
      <text x="52.5" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Three.js / WebGL</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="105" height="26" rx="13" fill="#151336" stroke="#475569" stroke-width="1" />
      <text x="172.5" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Framer Motion</text>

      <!-- Pill 3 -->
      <rect x="240" y="0" width="105" height="26" rx="13" fill="#151336" stroke="#475569" stroke-width="1" />
      <text x="292.5" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">GSAP / GreenSock</text>

      <!-- Pill 4 -->
      <rect x="360" y="0" width="115" height="26" rx="13" fill="#151336" stroke="#475569" stroke-width="1" />
      <text x="417.5" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Remotion (React)</text>

      <!-- Pill 5 -->
      <rect x="490" y="0" width="110" height="26" rx="13" fill="#151336" stroke="#475569" stroke-width="1" />
      <text x="545" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Lottie &amp; Rive</text>
    </g>
  </g>
</svg>
